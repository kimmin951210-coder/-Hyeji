
<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>혜지LIVE 생방송 안내</title>

  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-GVTSCTFPF4"></script>

  <script>
    window.dataLayer = window.dataLayer || [];

    function gtag() {
      dataLayer.push(arguments);
    }

    gtag('js', new Date());
    gtag('config', 'G-GVTSCTFPF4');

    // 버튼 클릭 추적
    function trackClick(eventName, buttonName, linkUrl) {
      gtag('event', eventName, {
        event_category: 'landing_button',
        button_name: buttonName,
        link_url: linkUrl,
        transport_type: 'beacon'
      });
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #241035;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .wrapper {
      position: relative;
      width: 100%;
      max-width: 891px;
      margin: 0 auto;
    }

    @media (min-width: 900px) {
      .wrapper {
        width: 45%;
        max-width: 720px;
      }
    }

    .wrapper img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* 클릭 영역 공통 */
    .click-zone {
      position: absolute;
      left: 4.4%;
      width: 90%;
      display: block;
      cursor: pointer;
      z-index: 10;
    }

    /* 1. 생방송 보러가기 */
    .zone1 {
      top: 45.0%;
      height: 10.5%;
    }

    /* 2. 오늘의 방송 일정 */
    .zone2 {
      top: 56.0%;
      height: 10.1%;
    }

    /* 3. 커뮤니티 문의 */
    .zone3 {
      top: 66.6%;
      height: 10.0%;
    }

    /* 4. 혜지 소통방 */
    .zone4 {
      top: 77.3%;
      height: 10.2%;
    }

    .click-zone:focus-visible {
      outline: 3px solid white;
      outline-offset: -3px;
    }
  </style>

</head>

<body>

  <div class="wrapper">

    <!-- 랜딩 이미지 -->
    <img
      src="./landing.png"
      alt="혜지LIVE 생방송 안내"
    />

    <!-- 1. 생방송 보러가기 -->
    <a
      class="click-zone zone1"
      href="http://xn--or3b21d71b.tv/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="생방송 보러가기"
      onclick="trackClick(
        'live_click',
        '생방송 보러가기',
        this.href
      )">
    </a>

    <!-- 2. 오늘의 방송 일정 -->
    <a
      class="click-zone zone2"
      href="https://open.kakao.com/o/s266v8Ag"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="오늘의 방송 일정"
      onclick="trackClick(
        'schedule_click',
        '오늘의 방송 일정',
        this.href
      )">
    </a>

    <!-- 3. 커뮤니티 문의 -->
    <a
      class="click-zone zone3"
      href="https://telegram.me/storyinquiry"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="커뮤니티 문의"
      onclick="trackClick(
        'community_click',
        '커뮤니티 문의',
        this.href
      )">
    </a>

    <!-- 4. 혜지 소통방 -->
    <a
      class="click-zone zone4"
      href="https://open.kakao.com/o/gJqGHqLi"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="혜지 소통방"
      onclick="trackClick(
        'chat_click',
        '혜지 소통방',
        this.href
      )">
    </a>

  </div>

</body>

</html>
